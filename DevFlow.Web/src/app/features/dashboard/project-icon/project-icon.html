@switch (type()) {
  @case ('code') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 4 13 9 8" />
      <polyline points="15 8 20 13 15 18" />
    </svg>
  }
  @case ('mobile') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2.5" width="12" height="19" rx="2.5" />
      <line x1="10.5" y1="18.3" x2="13.5" y2="18.3" />
    </svg>
  }
  @case ('devops') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 8.5a3.5 3.5 0 1 0 0 7c3.5 0 8-7 11-7a3.5 3.5 0 1 1 0 7c-3.5 0-8-7-11-7Z" />
    </svg>
  }
  @case ('api') {
    <span class="api-label">API</span>
  }
}
